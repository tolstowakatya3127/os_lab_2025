services:
  # S3-совместимое хранилище
  minio:
    image: docker.io/pgsty/silo:latest
    container_name: minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3

  # FUSE монтирование S3 (WARM tier)
  s3fs:
    build:
      context: .
      dockerfile: Dockerfile.s3fs
    container_name: s3fs
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: hybrid-storage
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
    volumes:
      - s3fs_mount:/mnt/s3

  # Демо приложение
  app:
    build:
      context: .
      dockerfile: app/Dockerfile.app
    depends_on:
      - s3fs
    volumes:
      - hot_storage:/data/hot
      - cold_storage:/data/cold
      - s3fs_mount:/data/warm:shared
    stdin_open: true
    tty: true
    command: ["python3", "hybrid_storage.py"]

volumes:
  minio_data:
  s3fs_mount:
  hot_storage:
  cold_storage: